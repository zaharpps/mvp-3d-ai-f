<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI Studio MVP</title>
    <!-- Подключаем Tailwind CSS для красивого интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Импортируем библиотеки Three.js и WebLLM прямо в браузере -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm"
        }
      }
    </script>
</head>
<body class="bg-gray-900 text-white h-screen flex overflow-hidden font-sans">

    <!-- 3D Визуализатор (Сцена) -->
    <div class="relative flex-1 h-full" id="canvas-container">
        <!-- Кнопка скачивания модели -->
        <div class="absolute top-4 right-4 z-10">
            <button id="download-btn" class="hidden bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg text-sm font-semibold shadow-lg transition cursor-pointer">
                Скачать .GLB (для Blender)
            </button>
        </div>
    </div>

    <!-- Боковая панель управления -->
    <div class="w-96 p-6 flex flex-col justify-between border-l border-gray-800 bg-gray-950">
        <div>
            <h1 class="text-xl font-bold mb-1">3D AI Studio MVP</h1>
            <p class="text-xs text-gray-400 mb-6">Генерация 3D через WebGPU в браузере</p>

            <!-- Кнопка запуска ИИ -->
            <div id="init-section" class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
                <p class="text-sm mb-4 text-gray-300">Запустите нейросеть прямо в браузере</p>
                <button id="init-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg font-medium text-sm transition cursor-pointer">
                    Запустить ИИ-движок
                </button>
            </div>

            <!-- Поле ввода запроса (скрыто до запуска ИИ) -->
            <div id="generator-section" class="hidden flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase">
                        Описание модели
                    </label>
                    <textarea id="prompt-input" placeholder="Например: a green pine tree with brown trunk"
                        class="w-full h-28 bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>
                <button id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg font-medium text-sm transition cursor-pointer">
                    Сгенерировать
                </button>
            </div>
        </div>

        <!-- Статус-бар -->
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
            <span class="text-xs text-gray-400 block mb-1">Статус:</span>
            <p id="status-text" class="text-xs font-mono text-indigo-400 truncate">Ожидание запуска ИИ...</p>
        </div>
    </div>

    <!-- Логика работы 3D и ИИ -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { CreateMLCEngine } from '@mlc-ai/web-llm';

        const SELECTED_MODEL = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
        const SYSTEM_PROMPT = `
You are a 3D modeling assistant generating JavaScript code using Three.js.
Your task is to generate ONLY the JavaScript code inside a function body.
The function signature is: function createModel(scene) { ... }

Rules:
1. Do NOT wrap the code in markdown code blocks like \`\`\`javascript.
2. Return ONLY plain JavaScript instructions.
3. Use 'scene.add(mesh)' to add objects.
4. Use standard geometries (BoxGeometry, SphereGeometry, CylinderGeometry, ConeGeometry, TorusGeometry, etc.).
5. Use MeshStandardMaterial with nice colors and rough/metal properties.
6. Create cohesive compound shapes based on the prompt.
7. Do not create lights or cameras, only meshes/groups added to 'scene'.
`;

        let engine = null;
        let scene, camera, renderer, controls;
        let currentModel = null;

        // 1. Инициализация Three.js сцены
        function initThree() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(5, 5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Свет и сетка
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(10, 10, 0x4b5563, 0x374151);
            scene.add(gridHelper);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        }

        initThree();

        // Элементы интерфейса
        const statusText = document.getElementById('status-text');
        const initBtn = document.getElementById('init-btn');
        const initSection = document.getElementById('init-section');
        const generatorSection = document.getElementById('generator-section');
        const generateBtn = document.getElementById('generate-btn');
        const promptInput = document.getElementById('prompt-input');
        const downloadBtn = document.getElementById('download-btn');

        // 2. Запуск WebLLM (ИИ)
        initBtn.addEventListener('click', async () => {
            try {
                initBtn.disabled = true;
                initBtn.innerText = 'Загрузка...';
                statusText.innerText = 'Инициализация WebGPU и загрузка модели...';

                engine = await CreateMLCEngine(SELECTED_MODEL, {
                    initProgressCallback: (progress) => {
                        statusText.innerText = progress.text;
                    }
                });

                statusText.innerText = 'ИИ успешно запущен!';
                initSection.classList.add('hidden');
                generatorSection.classList.remove('hidden');
                generatorSection.classList.add('flex');
            } catch (err) {
                console.error(err);
                statusText.innerText = 'Ошибка: нужен браузер с поддержкой WebGPU (Chrome/Edge).';
                initBtn.disabled = false;
                initBtn.innerText = 'Запустить ИИ-движок';
            }
        });

        // 3. Генерация 3D модели по запросу
        generateBtn.addEventListener('click', async () => {
            const promptText = promptInput.value.trim();
            if (!promptText || !engine) return;

            try {
                generateBtn.disabled = true;
                generateBtn.innerText = 'Создаем 3D...';
                statusText.innerText = 'Генерация кода модели...';

                const messages = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    { role: 'user', content: `Create a 3D model: ${promptText}` }
                ];

                const response = await engine.chat.completions.create({
                    messages,
                    temperature: 0.2,
                });

                let generatedCode = response.choices[0].message.content;
                generatedCode = generatedCode.replace(/```javascript/g, '').replace(/```/g, '').trim();

                // Удаляем старую модель со сцены
                if (currentModel) {
                    scene.remove(currentModel);
                }

                // Строим новую модель
                const modelGroup = new THREE.Group();
                const modelBuilderFn = new Function('scene', 'THREE', generatedCode);
                modelBuilderFn(modelGroup, THREE);

                scene.add(modelGroup);
                currentModel = modelGroup;

                downloadBtn.classList.remove('hidden');
                statusText.innerText = 'Модель готова!';
            } catch (err) {
                console.error(err);
                statusText.innerText = 'Ошибка при генерации модели.';
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = 'Сгенерировать';
            }
        });

        // 4. Экспорт и скачивание .GLB
        downloadBtn.addEventListener('click', () => {
            if (!currentModel) return;

            const exporter = new GLTFExporter();
            exporter.parse(
                currentModel,
                (gltf) => {
                    const blob = new Blob([gltf], { type: 'application/octet-stream' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'model.glb';
                    link.click();
                },
                (error) => console.error('Ошибка экспорта:', error),
                { binary: true }
            );
        });
    </script>
</body>
</html>
